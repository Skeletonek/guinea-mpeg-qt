spec:
  inputs:
    build_deb:
      type: boolean
      default: true
      description: Build x86_64 .deb package
    build_deb_aarch64:
      type: boolean
      default: true
      description: Build aarch64 .deb package (arm64 runner)
    build_rpm:
      type: boolean
      default: true
      description: Build x86_64 .rpm package
    build_rpm_aarch64:
      type: boolean
      default: true
      description: Build aarch64 .rpm package (arm64 runner)
    build_pacman:
      type: boolean
      default: true
      description: Build x86_64 .pkg.tar.zst package
    build_flatpak:
      type: boolean
      default: true
      description: Build x86_64 Flatpak package
    build_flatpak_aarch64:
      type: boolean
      default: true
      description: Build aarch64 Flatpak package (arm64 runner)
---
# Create the release before the package stage, then let each package job upload
# its own asset — one failing package can never block the others.
stages:
  - lint
  - release
  - package

variables:
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

# Package jobs skip plain branch pushes; tags are also pushes, so guard on CI_COMMIT_TAG.
.skip-on-push: &skip-on-push
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG == null
  when: never

.dind: &dind
  image: docker:29.0
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  before_script:
    - apk add --no-cache bash ruby binutils libarchive-tools rpm tar zstd patchelf glab
    - gem install fpm
  needs:
    - job: create-release
      artifacts: false

create-release:
  stage: release
  image: alpine:latest
  variables:
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  needs: []
  before_script:
    - apk add --no-cache glab
  script: |
    set -euo pipefail

    TAG="$CI_COMMIT_TAG"
    VERSION="${TAG#v}"
    NOTES=$(awk "/^### ${VERSION}/{flag=1; next} /^### [0-9]/{flag=0} flag" CHANGELOG.md)
    if [ -z "$NOTES" ]; then
      NOTES="GuineaMPEG $VERSION"
    fi
    printf "%s" "$NOTES" > changelog.md

    if glab release view "$TAG" >/dev/null 2>&1; then
      echo "Release $TAG already exists, skipping creation"
    else
      glab release create "$TAG" \
        --name "GuineaMPEG $TAG" \
        --notes-file changelog.md
    fi
  artifacts:
    paths:
      - changelog.md

package-deb:
  <<: *dind
  stage: package
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_deb ]]" == "true"'
  script:
    - ./build/linux-build.sh --release --package deb
    - glab release upload "$CI_COMMIT_TAG" out/deb/*.deb
  artifacts:
    paths:
      - out/deb/
    expire_in: 1 week

# Native ARM64 builds (no QEMU/binfmt needed — runner is arm64), so artifacts
# land in out/<target>/ without the -aarch64 suffix. dockerd runs with an MTU
# matching Google Cloud's (1400) — see GitLab's known Linux Arm dind issue.
package-deb-aarch64:
  <<: *dind
  stage: package
  tags:
    - saas-linux-small-arm64
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--mtu=1400"]
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_deb_aarch64 ]]" == "true"'
  script:
    - ./build/linux-build.sh --release --arch aarch64 --package deb
    - glab release upload "$CI_COMMIT_TAG" out/deb/*.deb
  artifacts:
    paths:
      - out/deb/
    expire_in: 1 week

package-rpm:
  <<: *dind
  stage: package
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_rpm ]]" == "true"'
  script:
    - ./build/linux-build.sh --release --package rpm
    - glab release upload "$CI_COMMIT_TAG" out/rpm/*.rpm
  artifacts:
    paths:
      - out/rpm/
    expire_in: 1 week

package-rpm-aarch64:
  <<: *dind
  stage: package
  tags:
    - saas-linux-small-arm64
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--mtu=1400"]
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_rpm_aarch64 ]]" == "true"'
  script:
    - ./build/linux-build.sh --release --arch aarch64 --package rpm
    - glab release upload "$CI_COMMIT_TAG" out/rpm/*.rpm
  artifacts:
    paths:
      - out/rpm/
    expire_in: 1 week

package-pacman:
  <<: *dind
  stage: package
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_pacman ]]" == "true"'
  script:
    - ./build/linux-build.sh --release --package pacman
    - glab release upload "$CI_COMMIT_TAG" out/pacman/*.pkg.tar.zst
  artifacts:
    paths:
      - out/pacman/
    expire_in: 1 week

package-flatpak:
  stage: package
  image: debian:trixie-slim
  variables:
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_flatpak ]]" == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      flatpak flatpak-builder git elfutils ca-certificates librsvg2-common glab
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  script:
    - ./build/linux-build.sh --release --package flatpak
    - glab release upload "$CI_COMMIT_TAG" out/flatpak/*.flatpak
  artifacts:
    paths:
      - out/flatpak/
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: create-release
      artifacts: false

# Flatpak bundles the host architecture, so arm64 flatpak builds need a real
# ARM64 runner (the script rejects aarch64 cross-builds).
package-flatpak-aarch64:
  stage: package
  image: debian:trixie-slim
  tags:
    - saas-linux-small-arm64
  variables:
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  rules:
    - *skip-on-push
    - if: '"$[[ inputs.build_flatpak_aarch64 ]]" == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      flatpak flatpak-builder git elfutils ca-certificates librsvg2-common glab
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  script:
    - ./build/linux-build.sh --release --arch aarch64 --package flatpak
    - glab release upload "$CI_COMMIT_TAG" out/flatpak/*.flatpak
  artifacts:
    paths:
      - out/flatpak/
    expire_in: 1 week
  allow_failure: true
  needs:
    - job: create-release
      artifacts: false

lint:
  stage: lint
  image: fedora:44
  # Advisory only: never blocks package/release pipelines on the same push.
  allow_failure: true
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  before_script:
    - dnf -y install qt6-qtdeclarative-devel qt6-qtdeclarative qt6-qtquickcontrols2
      qt6-qtmultimedia rust cargo rustfmt clippy clang-tools-extra
    - export LANG=C.UTF-8
  script:
    - ./build/run-lint.sh
