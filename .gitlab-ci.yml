stages:
  - package
  - release

variables:
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_COMMIT_TAG

.dind: &dind
  image: docker:24.0
  services:
    - name: docker:24.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash ruby ruby-json binutils libarchive-tools rpm tar zstd
    - gem install fpm
  needs: []

package-generic:
  <<: *dind
  stage: package
  script:
    - docker build -t guinea-build -f build/docker/debian-trixie.Dockerfile build/docker
    - docker run --rm -v $PWD:/build -w /build guinea-build ./build/linux_build.sh
  artifacts:
    paths:
      - out/generic/
    expire_in: 1 week
  needs: []

package-deb:
  <<: *dind
  stage: package
  script:
    - ./build/linux_build.sh --package deb
  artifacts:
    paths:
      - out/deb/
    expire_in: 1 week

package-rpm:
  <<: *dind
  stage: package
  script:
    - ./build/linux_build.sh --package rpm
  artifacts:
    paths:
      - out/rpm/
    expire_in: 1 week

package-pacman:
  <<: *dind
  stage: package
  script:
    - ./build/linux_build.sh --package pacman
  artifacts:
    paths:
      - out/pacman/
    expire_in: 1 week

package-flatpak:
  stage: package
  image: debian:trixie-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      flatpak flatpak-builder git elfutils ca-certificates librsvg2-common
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  script:
    - ./build/linux_build.sh --package flatpak
  artifacts:
    paths:
      - out/flatpak/
    expire_in: 1 week
  allow_failure: true
  needs: []

release:
  stage: release
  image: alpine:latest
  variables:
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  needs:
    - job: package-generic
      artifacts: true
    - job: package-deb
      artifacts: true
    - job: package-rpm
      artifacts: true
    - job: package-pacman
      artifacts: true
    - job: package-flatpak
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache git glab
  script: |
    set -euo pipefail

    TAG="$CI_COMMIT_TAG"
    VERSION="${TAG#v}"
    NOTES=$(awk "/^### ${VERSION}/{flag=1; next} /^### [0-9]/{flag=0} flag" CHANGELOG.md)

    if [ -z "$NOTES" ]; then
      NOTES="GuineaMPEG $VERSION"
    fi

    mkdir -p release-assets
    find out/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.flatpak" \) -exec cp {} release-assets/ \;

    printf "%s" "$NOTES" > changelog.md
    glab release create "$TAG" \
      --name "GuineaMPEG $TAG" \
      --notes-file changelog.md
    if ls release-assets/* >/dev/null 2>&1; then
      glab release upload "$TAG" release-assets/*
    fi
  artifacts:
    paths:
      - changelog.md
    expire_in: 1 year
