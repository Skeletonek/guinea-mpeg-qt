spec:
  inputs:
    build_generic:
      type: boolean
      default: true
      description: Build generic .tar.gz package
    build_deb:
      type: boolean
      default: true
      description: Build x86_64 .deb package
    build_deb_aarch64:
      type: boolean
      default: true
      description: Build aarch64 .deb package (arm64 runner)
    build_rpm:
      type: boolean
      default: true
      description: Build x86_64 .rpm package
    build_rpm_aarch64:
      type: boolean
      default: true
      description: Build aarch64 .rpm package (arm64 runner)
    build_pacman:
      type: boolean
      default: true
      description: Build x86_64 .pkg.tar.zst package
    build_flatpak:
      type: boolean
      default: true
      description: Build x86_64 Flatpak package
    build_flatpak_aarch64:
      type: boolean
      default: true
      description: Build aarch64 Flatpak package (arm64 runner)
---
stages:
  - package
  - release

variables:
  GIT_DEPTH: 0

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

.dind: &dind
  image: docker:29.0
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash ruby ruby-json binutils libarchive-tools rpm tar zstd patchelf
    - gem install fpm
  needs: []

package-generic:
  <<: *dind
  stage: package
  rules:
    - if: '"$[[ inputs.build_generic ]]" == "true"'
  script:
    - docker build -t guinea-build -f build/docker/debian-trixie.Dockerfile build/docker
    - docker run --rm -v $PWD:/build -w /build guinea-build ./build/linux-build.sh
  artifacts:
    paths:
      - out/generic/
    expire_in: 1 week
  needs: []

package-deb:
  <<: *dind
  stage: package
  rules:
    - if: '"$[[ inputs.build_deb ]]" == "true"'
  script:
    - ./build/linux-build.sh --package deb
  artifacts:
    paths:
      - out/deb/
    expire_in: 1 week

# Native ARM64 builds (no QEMU/binfmt needed — runner is arm64), so artifacts
# land in out/<target>/ without the -aarch64 suffix. dockerd runs with an MTU
# matching Google Cloud's (1400) — see GitLab's known Linux Arm dind issue.
package-deb-aarch64:
  <<: *dind
  stage: package
  tags:
    - saas-linux-small-arm64
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--mtu=1400"]
  rules:
    - if: '"$[[ inputs.build_deb_aarch64 ]]" == "true"'
  script:
    - ./build/linux-build.sh --arch aarch64 --package deb
  artifacts:
    paths:
      - out/deb/
    expire_in: 1 week

package-rpm:
  <<: *dind
  stage: package
  rules:
    - if: '"$[[ inputs.build_rpm ]]" == "true"'
  script:
    - ./build/linux-build.sh --package rpm
  artifacts:
    paths:
      - out/rpm/
    expire_in: 1 week

package-rpm-aarch64:
  <<: *dind
  stage: package
  tags:
    - saas-linux-small-arm64
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--mtu=1400"]
  rules:
    - if: '"$[[ inputs.build_rpm_aarch64 ]]" == "true"'
  script:
    - ./build/linux-build.sh --arch aarch64 --package rpm
  artifacts:
    paths:
      - out/rpm/
    expire_in: 1 week

package-pacman:
  <<: *dind
  stage: package
  rules:
    - if: '"$[[ inputs.build_pacman ]]" == "true"'
  script:
    - ./build/linux-build.sh --package pacman
  artifacts:
    paths:
      - out/pacman/
    expire_in: 1 week

package-flatpak:
  stage: package
  image: debian:trixie-slim
  rules:
    - if: '"$[[ inputs.build_flatpak ]]" == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      flatpak flatpak-builder git elfutils ca-certificates librsvg2-common
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  script:
    - ./build/linux-build.sh --package flatpak
  artifacts:
    paths:
      - out/flatpak/
    expire_in: 1 week
  allow_failure: true
  needs: []

# Flatpak bundles the host architecture, so arm64 flatpak builds need a real
# ARM64 runner (the script rejects aarch64 cross-builds).
package-flatpak-aarch64:
  stage: package
  image: debian:trixie-slim
  tags:
    - saas-linux-small-arm64
  rules:
    - if: '"$[[ inputs.build_flatpak_aarch64 ]]" == "true"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends
      flatpak flatpak-builder git elfutils ca-certificates librsvg2-common
    - flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
  script:
    - ./build/linux-build.sh --arch aarch64 --package flatpak
  artifacts:
    paths:
      - out/flatpak/
    expire_in: 1 week
  allow_failure: true
  needs: []

release:
  stage: release
  image: alpine:latest
  variables:
    GITLAB_TOKEN: $GITLAB_ACCESS_TOKEN
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: package-generic
      artifacts: true
    - job: package-deb
      artifacts: true
    - job: package-rpm
      artifacts: true
    - job: package-pacman
      artifacts: true
    - job: package-flatpak
      artifacts: true
      optional: true
    - job: package-deb-aarch64
      artifacts: true
      optional: true
    - job: package-rpm-aarch64
      artifacts: true
      optional: true
    - job: package-flatpak-aarch64
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache git glab
  script: |
    set -euo pipefail

    TAG="$CI_COMMIT_TAG"
    VERSION="${TAG#v}"
    NOTES=$(awk "/^### ${VERSION}/{flag=1; next} /^### [0-9]/{flag=0} flag" CHANGELOG.md)

    if [ -z "$NOTES" ]; then
      NOTES="GuineaMPEG $VERSION"
    fi

    mkdir -p release-assets
    find out/ -type f \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.flatpak" \) -exec cp {} release-assets/ \;

    printf "%s" "$NOTES" > changelog.md
    glab release create "$TAG" \
      --name "GuineaMPEG $TAG" \
      --notes-file changelog.md
    if ls release-assets/* >/dev/null 2>&1; then
      glab release upload "$TAG" release-assets/*
    fi
  artifacts:
    paths:
      - changelog.md
