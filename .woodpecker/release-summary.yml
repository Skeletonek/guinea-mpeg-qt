when:
  - event: tag
  - event: push  # DEBUG/TODO: temporary — build on push for testing; remove before release

depends_on:
  - appimage
  - windows

labels:
  platform: linux/amd64
  backend: docker

steps:
  - name: links-summary
    image: debian:trixie-slim
    environment:
      FILEN_AUTH_CONFIG_B64:
        from_secret: filen_auth_config_b64
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
      - bash build/ci/release-summary.sh