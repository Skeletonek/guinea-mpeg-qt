id: com.skeletonek.guinea-mpeg
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: guinea-mpeg
finish-args:
  - --socket=wayland
  - --socket=x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri
  - --filesystem=host
  - --share=network
  - --talk-name=org.freedesktop.Flatpak
  - --env=LC_NUMERIC=C

modules:
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dtests=false
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Dlcms=enabled
      - -Dopengl=enabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.349.0

  - name: libass
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.3

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dcplayer=false
      - -Dlibmpv=true
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Ddvdnav=disabled
      - -Dmanpage-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.38.0

  - name: guinea-mpeg
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/guinea-mpeg/cargo
        LIBRARY_PATH: /app/lib
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: dir
        path: ../../
    post-install:
      - install -Dm644 ../build/flatpak/com.skeletonek.guinea-mpeg.desktop /app/share/applications/com.skeletonek.guinea-mpeg.desktop
      - install -Dm644 ../build/linux/icons/hicolor/scalable/apps/guinea-mpeg.svg /app/share/icons/hicolor/scalable/apps/com.skeletonek.guinea-mpeg.svg
      - install -Dm644 ../build/linux/icons/hicolor/256x256/apps/guinea-mpeg.png /app/share/icons/hicolor/256x256/apps/com.skeletonek.guinea-mpeg.png
