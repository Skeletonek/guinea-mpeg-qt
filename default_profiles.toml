# The `category` key drives the picker's section groups; profiles without one
# fall into a trailing "Custom" group.

# Quality: high-fidelity video encodes
[[profiles]]
name = "H.264 High"
codec = "h264"
encoder = "libx264"
crf = 18
preset = "slow"
tune = "film"
resolution = "1080p"
framerate = 0.0
pixel_format = "yuv420p"
audio_bitrate = "256k"
audio_channels = 2
audio_sample_rate = 48000
category = "Quality"

[[profiles]]
name = "VP9 High"
codec = "vp9"
encoder = "libvpx-vp9"
crf = 26
preset = "good"
cpu_used = 2
