[package]
name = "guinea-mpeg-core"
version = "0.5.0-dev"
edition = "2021"

[lib]
name = "guinea_mpeg_core"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "5.0"
libmpv2-sys = "4.0"

[profile.release]
strip = true
